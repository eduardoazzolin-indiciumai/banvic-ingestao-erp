apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-target
  namespace: dw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-target
  template:
    metadata:
      labels:
        app: postgres-target
    spec:
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dbname
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
